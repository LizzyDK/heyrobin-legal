<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a trip · Hey Robin</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 40px 24px; display: flex; justify-content: center; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p { color: #556; line-height: 1.5; }
  @media (prefers-color-scheme: dark) { p { color: #aab; } body { background: #111; color: #eee; } }
  .btn { display: inline-block; margin: 18px 0 8px; padding: 14px 28px; border-radius: 14px; background: #1f3a5f; color: #fff; text-decoration: none; font-weight: 600; }
  code { display: block; margin: 14px auto; padding: 12px; border: 1px dashed #999; border-radius: 10px; font-size: 1.05rem; user-select: all; word-break: break-all; max-width: 320px; }
  .small { font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>You’re invited to a trip 🐦</h1>
  <p>Someone shared a Hey Robin trip with you.</p>
  <a class="btn" id="open" href="#">Open in Hey Robin</a>
  <p class="small">If nothing happens, open the Hey Robin app, tap <strong>“Join a trip”</strong> on the home screen, and enter this code:</p>
  <code id="code">—</code>
  <p class="small">Don’t have the app yet? Get Hey Robin on the App Store, then come back and tap the button.</p>
</main>
<script>
  var c = new URLSearchParams(location.search).get('c') || '';
  document.getElementById('code').textContent = c || 'missing code';
  document.getElementById('open').href = 'heyrobin://join/' + encodeURIComponent(c);
</script>
</body>
</html>
